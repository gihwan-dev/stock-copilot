  { crate = "proptest", reason = "D-01 domain 개발 의존: 속성 테스트" },
  { crate = "rand", reason = "proptest → rand: 테스트 난수 생성" },
  { crate = "rand_core", reason = "proptest → rand·rand_xorshift·chacha20 → rand_core" },
