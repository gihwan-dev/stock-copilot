[graph]
all-features = true
no-default-features = false
exclude-dev = false
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin"]

[output]
feature-depth = 1

[advisories]
version = 2
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
unmaintained = "all"
unsound = "all"
ignore = [
  { id = "RUSTSEC-2024-0436", reason = "paste는 tauri-specta =2.0.0-rc.28의 고정 의존성이다. 유지 중단 권고일 뿐 취약점이 아니고, 빌드 시점 매크로로만 쓰인다 (ADR 0016)" },
  { id = "RUSTSEC-2026-0543", reason = "chrono는 rmcp =3.9.0과 schemars =1.2.3의 무조건 의존성이다. 유지 중단 권고일 뿐 취약점이 아니고, mcp-server는 chrono를 직접 쓰지 않는다 (M-01 ADR 초안)" },
]

[licenses]
version = 2
confidence-threshold = 0.93
allow = ["Apache-2.0", "Apache-2.0 WITH LLVM-exception", "MIT", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib"]
exceptions = [
  { crate = "sqlcipher-src", allow = ["blessing", "WTFPL"] },
  { crate = "cssparser", allow = ["MPL-2.0"] },
  { crate = "cssparser-macros", allow = ["MPL-2.0"] },
  { crate = "dtoa-short", allow = ["MPL-2.0"] },
  { crate = "option-ext", allow = ["MPL-2.0"] },
  { crate = "selectors", allow = ["MPL-2.0"] },
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"
workspace-default-features = "allow"
