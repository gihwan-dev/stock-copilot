prettier-binary = "node_modules/.bin/prettier"
eslint-binary = "apps/desktop/node_modules/.bin/eslint"

prettier = ["apps/desktop", "harness", "package.json", "pnpm-workspace.yaml"]

[[eslint]]
directory = "apps/desktop"
config = "apps/desktop/eslint.config.mjs"
paths = ["apps/desktop/src"]

[[eslint]]
directory = "."
config = "apps/desktop/eslint.scripts.config.mjs"
paths = [
    "apps/desktop/tests",
    "apps/desktop/eslint",
    "apps/desktop/eslint.config.mjs",
    "apps/desktop/eslint.scripts.config.mjs",
    "harness",
]
