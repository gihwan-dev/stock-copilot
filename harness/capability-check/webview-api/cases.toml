[[case.file]]
path = "src/lib.rs"
source = '''
pub fn build_app<R: Runtime>(builder: Builder<R>, context: Context<R>) -> Result<App<R>, tauri::Error> {
    builder
        .invoke_handler(ipc::registry::specta_builder::<R>().invoke_handler())
        .build(context)
}
'''

[[case.file]]
path = "src/ipc/registry.rs"
source = '''
use tauri_specta::{Builder, collect_commands};

pub fn specta_builder<R: Runtime>() -> Builder<R> {
    let commands = collect_commands![app_version::app_version::<tauri::Wry>];
    Builder::<R>::new().commands(commands)
}
'''

