[edges]
domain = []
application = ["domain"]
order-execution = ["application", "domain"]
approval-command = ["order-execution", "application", "domain"]
broker-toss-schema = []
broker-toss = ["broker-toss-schema", "application", "domain"]
broker-toss-trade = ["broker-toss", "broker-toss-schema", "order-execution", "application", "domain"]
sources = ["application", "domain"]
ai-claude-code = ["application", "domain"]
ai-codex = ["application", "domain"]
store-sqlite = ["application", "domain"]
secrets-keychain = ["application", "domain"]
platform-macos = ["application", "domain"]
mcp-server = ["application", "domain"]
mcp-bridge = []
scheduler = ["application", "domain"]
testkit = ["application", "domain"]
trade-fakes = ["order-execution", "application", "domain"]
src-tauri = [
    "domain",
    "application",
    "approval-command",
    "broker-toss",
    "broker-toss-trade",
    "sources",
    "ai-claude-code",
    "ai-codex",
    "store-sqlite",
    "secrets-keychain",
    "platform-macos",
    "mcp-server",
    "scheduler",
]
e2e-app = ["src-tauri", "testkit", "trade-fakes"]
toss-smoke = ["broker-toss", "application", "domain"]
xtask = []

[dev-edges]
other-crates = ["testkit"]

[dev-edges.crates]
src-tauri = ["testkit", "trade-fakes"]
order-execution = ["testkit"]
xtask = []

[[restricted]]
target = "order-execution"
dependents = [
    { crate = "approval-command", kinds = ["normal", "build"] },
    { crate = "broker-toss-trade", kinds = ["normal", "build"] },
    { crate = "trade-fakes", kinds = ["normal", "build"] },
]
transitive-forbidden = [
    "domain",
    "application",
    "mcp-server",
    "mcp-bridge",
    "scheduler",
    "ai-claude-code",
    "ai-codex",
    "sources",
    "store-sqlite",
    "secrets-keychain",
    "platform-macos",
    "broker-toss",
    "broker-toss-schema",
    "testkit",
    "toss-smoke",
    "xtask",
]

[[restricted]]
target = "approval-command"
dependents = [{ crate = "src-tauri", kinds = ["normal", "build"] }]
transitive-forbidden-all-except = ["src-tauri", "e2e-app"]

[[restricted]]
target = "broker-toss-trade"
dependents = [{ crate = "src-tauri", kinds = ["normal", "build"] }]
transitive-forbidden-all-except = ["src-tauri", "e2e-app"]

[[restricted]]
target = "trade-fakes"
dependents = [
    { crate = "e2e-app", kinds = ["normal"] },
    { crate = "src-tauri", kinds = ["dev"] },
]

[[restricted]]
target = "testkit"
dependents = [{ crate = "e2e-app", kinds = ["normal"] }]
any-dependent-kinds = ["dev"]

[[restricted]]
target = "broker-toss-schema"
dependents = [
    { crate = "broker-toss", kinds = ["normal", "build"] },
    { crate = "broker-toss-trade", kinds = ["normal", "build"] },
]

[[restricted]]
target = "mcp-bridge"
dependents = []

[[restricted]]
target = "xtask"
dependents = []

[product-bin]
package = "src-tauri"
forbidden = [
    "testkit",
    "trade-fakes",
    "tauri-plugin-wdio-webdriver",
    "tauri-plugin-playwright",
    "tauri-plugin-webdriver",
]

[[external-location]]
crates = ["tauri", "tauri-specta", "specta", "specta-typescript"]
prefixes = ["tauri-plugin-"]
allowed-in = ["src-tauri", "e2e-app"]

[[external-location]]
crates = ["tauri-plugin-wdio-webdriver", "tauri-plugin-playwright", "tauri-plugin-webdriver"]
allowed-in = ["e2e-app"]

[[external-location]]
crates = ["rmcp"]
allowed-in = ["mcp-server", "testkit"]

[[external-location]]
crates = ["rusqlite", "libsqlite3-sys"]
allowed-in = ["store-sqlite"]

[[external-location]]
crates = ["security-framework"]
allowed-in = ["secrets-keychain"]

[[external-location]]
crates = ["objc2-local-authentication", "rfd"]
allowed-in = ["platform-macos"]

[[external-location]]
crates = ["reqwest", "hyper", "hyper-util", "ureq", "isahc", "surf", "attohttpc", "curl", "awc"]
allowed-in = ["broker-toss", "broker-toss-trade", "sources"]

[[external-location]]
crates = ["serde"]
forbidden-in = ["domain"]

[[external-location]]
crates = ["cargo_metadata", "syn", "proc-macro2", "ra-ap-rustc_lexer", "toml"]
allowed-in = ["xtask"]

[[external-allowlist]]
crate = "domain"
allowed = ["rust_decimal"]

[[external-allowlist]]
crate = "xtask"
allowed = ["cargo_metadata", "syn", "proc-macro2", "ra-ap-rustc_lexer", "toml"]

[[feature-location]]
external = "tokio"
features = ["process", "full"]
allowed-in = ["ai-claude-code", "ai-codex", "src-tauri", "testkit"]

[[feature-allowlist]]
external = "rmcp"
dependent = "testkit"
default-features = "off"
features = ["client"]

[source.reexport]
crates = ["approval-command", "broker-toss-trade", "trade-fakes"]

[source.user-presence]
trait-name = "UserPresence"
impl-crates = ["platform-macos", "testkit"]

[source.toss-order]
write-methods = ["POST", "PUT", "PATCH", "DELETE"]
order-path-segments = ["orders", "conditional-orders"]
allowed-crates = ["broker-toss-trade"]

[source.toss-host]
needle = "tossinvest.com"
allowed-crates = ["toss-smoke"]
allowed-files = ["apps/desktop/src-tauri/src/main.rs"]
