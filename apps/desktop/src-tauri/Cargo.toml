[package]
name = "src-tauri"
version.workspace = true
edition.workspace = true
publish.workspace = true
default-run = "src-tauri"

[dependencies]
application = { path = "../../../crates/application" }
approval-command = { path = "../../../crates/approval-command" }
domain = { path = "../../../crates/domain" }
platform-macos = { path = "../../../crates/adapters/platform-macos" }
store-sqlite = { path = "../../../crates/adapters/store-sqlite" }
secrets-keychain = { path = "../../../crates/adapters/secrets-keychain" }
broker-toss = { path = "../../../crates/adapters/broker-toss" }
scheduler = { path = "../../../crates/scheduler" }
mcp-server = { path = "../../../crates/mcp-server" }
ai-claude-code = { path = "../../../crates/adapters/ai-claude-code" }
sources = { path = "../../../crates/adapters/sources" }
tauri = { workspace = true }
tauri-specta = { workspace = true }
specta = { workspace = true }
specta-typescript = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "=1.54.1", default-features = false, features = ["rt", "sync", "time"] }
tauri-plugin-updater = { version = "=2.14.1", default-features = false, features = ["zip"] }

[build-dependencies]
tauri-build = { workspace = true }

[lints]
workspace = true

[dev-dependencies]
tauri = { workspace = true, features = ["test"] }
testkit = { path = "../../../crates/testkit" }
testkit-ports = { path = "../../../crates/testkit-ports" }
trade-fakes = { path = "../../../crates/trade-fakes" }
