[workspace]
resolver = "3"
members = [
    "crates/domain",
    "crates/application",
    "crates/order-execution",
    "crates/approval-command",
    "crates/adapters/broker-toss-schema",
    "crates/adapters/broker-toss",
    "crates/adapters/broker-toss-trade",
    "crates/adapters/sources",
    "crates/adapters/ai-claude-code",
    "crates/adapters/ai-codex",
    "crates/adapters/store-sqlite",
    "crates/adapters/secrets-keychain",
    "crates/adapters/platform-macos",
    "crates/mcp-server",
    "crates/mcp-bridge",
    "crates/scheduler",
    "crates/testkit",
    "crates/trade-fakes",
    "crates/toss-smoke",
    "crates/xtask",
    "apps/desktop/src-tauri",
    "apps/desktop/e2e-app",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
publish = false

[workspace.dependencies]
tauri = { version = "=2.12.5", default-features = false, features = ["wry"] }
tauri-build = { version = "=2.7.4", default-features = false }
cargo_metadata = "=0.23.1"

[workspace.lints.rust]
unsafe_code = "forbid"
unstable_features = "forbid"
unused_must_use = "forbid"
warnings = { level = "deny", priority = -2 }
future_incompatible = { level = "deny", priority = -1 }
let_underscore = { level = "deny", priority = -1 }
nonstandard_style = { level = "deny", priority = -1 }
rust_2018_idioms = { level = "deny", priority = -1 }
unused = { level = "deny", priority = -1 }
deprecated_in_future = "deny"
elided_lifetimes_in_paths = "deny"
explicit_outlives_requirements = "deny"
macro_use_extern_crate = "deny"
meta_variable_misuse = "deny"
missing_debug_implementations = "deny"
non_ascii_idents = "deny"
redundant_lifetimes = "deny"
single_use_lifetimes = "deny"
trivial_casts = "deny"
trivial_numeric_casts = "deny"
unit_bindings = "deny"
unnameable_types = "deny"
unreachable_pub = "deny"
unused_import_braces = "deny"
unused_lifetimes = "deny"
unused_macro_rules = "deny"
unused_qualifications = "deny"
unexpected_cfgs = { level = "deny", check-cfg = ["cfg(clippy)"] }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }

missing_errors_doc = "allow"
missing_panics_doc = "allow"
cargo_common_metadata = "allow"
multiple_crate_versions = "allow"
redundant_pub_crate = "allow"
missing_const_for_fn = "allow"
option_if_let_else = "allow"
significant_drop_tightening = "allow"

unwrap_used = "forbid"
expect_used = "forbid"
panic = "forbid"
todo = "forbid"
unimplemented = "forbid"
unreachable = "forbid"
panic_in_result_fn = "forbid"
unwrap_in_result = "forbid"
get_unwrap = "forbid"
indexing_slicing = "forbid"
string_slice = "forbid"
exit = "forbid"
mem_forget = "forbid"
fallible_impl_from = "forbid"

as_conversions = "forbid"
as_underscore = "forbid"
as_pointer_underscore = "forbid"
arithmetic_side_effects = "forbid"
integer_division = "forbid"
modulo_arithmetic = "forbid"
float_arithmetic = "forbid"
float_cmp_const = "forbid"
lossy_float_literal = "forbid"
default_numeric_fallback = "forbid"

wildcard_enum_match_arm = "forbid"
rest_pat_in_fully_bound_structs = "forbid"
unneeded_field_pattern = "deny"

let_underscore_must_use = "forbid"
let_underscore_untyped = "forbid"
unused_result_ok = "forbid"
map_err_ignore = "forbid"
assertions_on_result_states = "forbid"
try_err = "deny"

allow_attributes = "forbid"
allow_attributes_without_reason = "forbid"
cfg_not_test = "forbid"
tests_outside_test_module = "forbid"

print_stdout = "forbid"
print_stderr = "forbid"
dbg_macro = "forbid"
use_debug = "deny"

clone_on_ref_ptr = "deny"
create_dir = "deny"
deref_by_slicing = "deny"
empty_drop = "deny"
empty_enum_variants_with_brackets = "deny"
empty_structs_with_brackets = "deny"
error_impl_error = "deny"
filetype_is_file = "deny"
if_then_some_else_none = "deny"
impl_trait_in_params = "deny"
infinite_loop = "deny"
iter_over_hash_type = "deny"
large_include_file = "deny"
min_ident_chars = "deny"
missing_assert_message = "deny"
mixed_read_write_in_expression = "deny"
mod_module_files = "deny"
multiple_inherent_impl = "deny"
mutex_atomic = "deny"
partial_pub_fields = "deny"
pathbuf_init_then_push = "deny"
pub_without_shorthand = "deny"
rc_buffer = "deny"
rc_mutex = "deny"
redundant_type_annotations = "deny"
ref_patterns = "deny"
renamed_function_params = "deny"
return_and_then = "deny"
same_name_method = "deny"
semicolon_outside_block = "deny"
shadow_reuse = "deny"
shadow_same = "deny"
shadow_unrelated = "deny"
str_to_string = "deny"
string_add = "deny"
string_lit_chars_any = "deny"
suspicious_xor_used_as_pow = "deny"
unnecessary_self_imports = "deny"
unseparated_literal_suffix = "deny"
verbose_file_reads = "deny"
needless_pass_by_value = "deny"
fn_params_excessive_bools = "deny"
struct_excessive_bools = "deny"
disallowed_methods = "deny"
disallowed_types = "deny"
disallowed_macros = "deny"
