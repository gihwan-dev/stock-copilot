default_permissions = "stock-copilot"
approval_policy = "never"
allow_login_shell = false
[features]
hooks = true
shell_snapshot = false
network_proxy = true
[shell_environment_policy]
inherit = "core"
ignore_default_excludes = false
[shell_environment_policy.set]
PATH = "/Users/choegihwan/Library/pnpm:/Users/choegihwan/.nvm/versions/node/v24.22.0/bin:/Users/choegihwan/.cargo/bin:/opt/homebrew/bin:/usr/bin:/bin:/usr/sbin:/sbin"
[permissions.stock-copilot]
extends = ":workspace"
[permissions.stock-copilot.filesystem]
"/Users/choegihwan/.cargo/registry" = "write"
"/Users/choegihwan/.cargo/advisory-dbs/db.lock" = "write"
"/Users/choegihwan/Library/pnpm/store" = "write"
"/private/tmp/pnpm-store-operation-locks-501" = "write"
"/private/tmp/pnpm-dir-locks-501" = "write"
"/private/tmp/pnpm-modules-swaps-501" = "write"
"/Users/choegihwan/.cargo/registry/src" = "read"
"/Users/choegihwan/.gitconfig" = "read"
"/Users/choegihwan/.config/git" = "read"
"/Users/choegihwan/.rustup/settings.toml" = "read"
"/Users/choegihwan/.cargo/config" = "read"
"/Users/choegihwan/.cargo/config.toml" = "read"
"/Users/choegihwan/.ssh" = "deny"
"/Users/choegihwan/.aws" = "deny"
"/Users/choegihwan/.gnupg" = "deny"
"/Users/choegihwan/.config/gh" = "deny"
"/Users/choegihwan/.netrc" = "deny"
"/Users/choegihwan/.npmrc" = "deny"
"/Users/choegihwan/.docker" = "deny"
"/Users/choegihwan/.kube" = "deny"
"/Users/choegihwan/Library/Keychains" = "deny"
"/Users/choegihwan/Library/Cookies" = "deny"
"/Users/choegihwan/Library/Application Support/Google/Chrome" = "deny"
"/Users/choegihwan/Library/Application Support/BraveSoftware" = "deny"
"/Users/choegihwan/Library/Application Support/Microsoft Edge" = "deny"
"/Users/choegihwan/Library/Application Support/Firefox" = "deny"
"/Users/choegihwan/Library/Application Support/Arc" = "deny"
"/Users/choegihwan/Library/Safari" = "deny"
"/Users/choegihwan/.claude" = "deny"
"/Users/choegihwan/.local/state/stock-copilot-harness" = "deny"
"/Users/choegihwan/.codex" = "deny"
[permissions.stock-copilot.filesystem.":workspace_roots"]
".claude" = "read"
".codex" = "read"
".cargo" = "read"
".cargo/config" = "read"
".cargo/config.toml" = "read"
".git/info" = "read"
"harness/claude-hooks/hashes.json" = "read"
"harness/claude-hooks/lock.txt" = "read"
"harness/sandbox/lock-fragment.json" = "read"
[permissions.stock-copilot.network]
enabled = true
[permissions.stock-copilot.network.domains]
"registry.npmjs.org" = "allow"
"index.crates.io" = "allow"
"static.crates.io" = "allow"
[permissions.stock-copilot.network.unix_sockets]
"/private/tmp/claude-501" = "allow"
