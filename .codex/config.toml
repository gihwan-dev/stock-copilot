default_permissions = "stock-copilot"
approval_policy = "never"
allow_login_shell = false
[features]
hooks = true
shell_snapshot = false
network_proxy = true
[shell_environment_policy]
inherit = "core"
ignore_default_excludes = false
[permissions.stock-copilot]
extends = ":workspace"
[permissions.stock-copilot.filesystem]
"~/.cargo/registry" = "write"
"~/.cargo/advisory-dbs/db.lock" = "write"
"~/Library/pnpm/store" = "write"
"~/.cargo/registry/src" = "read"
"~/.gitconfig" = "read"
"~/.config/git" = "read"
"~/.claude" = "deny"
"~/.rustup/settings.toml" = "read"
"~/.cargo/config" = "read"
"~/.cargo/config.toml" = "read"
"~/.local/state/stock-copilot-harness" = "deny"
"~/.ssh" = "deny"
"~/.aws" = "deny"
"~/.gnupg" = "deny"
"~/.config/gh" = "deny"
"~/.netrc" = "deny"
"~/.npmrc" = "deny"
"~/.docker" = "deny"
"~/.kube" = "deny"
"~/Library/Keychains" = "deny"
"~/Library/Cookies" = "deny"
"~/Library/Application Support/Google/Chrome" = "deny"
"~/Library/Application Support/BraveSoftware" = "deny"
"~/Library/Application Support/Microsoft Edge" = "deny"
"~/Library/Application Support/Firefox" = "deny"
"~/Library/Application Support/Arc" = "deny"
"~/Library/Safari" = "deny"
"~/.claude-*/projects" = "deny"
