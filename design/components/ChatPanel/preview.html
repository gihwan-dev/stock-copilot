<!doctype html>
<html>
<head><meta charset="utf-8"><title>ChatPanel — preview</title></head>
<body>
<div id="root" class=""></div>
<script>
  var S = window.StockCopilot, h = React.createElement;
  var msgs = [{ role: 'user', content: '반도체에 너무 쏠려 있어?' }, { role: 'assistant', activity: '보유 종목과 자산배분을 확인했어요', content: '반도체 비중이 **48.0%**예요. 직접 정하신 상한 40%보다 8.0%p 높아요.\n\n- 삼성전자 38.6%\n- SK하이닉스 9.4%', sources: [{ label: '보유종목 · 15:30 동기화' }], note: '참고용 의견이에요. 매매 판단은 직접 해주세요.' }];
  function Demo() {
    var st = React.useState('idle');
    var m = st[0] === 'streaming' ? msgs.concat([{ role: 'user', content: '그럼 뭘 줄이면 돼?' }, { role: 'assistant', content: '줄인다면 SK하이닉스부터 보는 게' }]) : st[0] === 'looking' ? msgs.concat([{ role: 'user', content: '그럼 뭘 줄이면 돼?' }]) : st[0] === 'empty' ? [] : msgs;
    return h('div', { className: 'sc-stack' },
      h(S.SegmentedControl, { label: '상태', options: [{ value: 'idle', label: '기본' }, { value: 'looking', label: '조회 중' }, { value: 'streaming', label: '답변 중' }, { value: 'error', label: '오류' }, { value: 'empty', label: '빈 대화' }], value: st[0], onChange: st[1] }),
      h('div', { className: 'sc-shell-chat', style: { height: 480, borderRadius: 'var(--radius-lg)', border: 'var(--border-hairline) solid var(--line)' } },
        h(S.ChatPanel, { messages: m, status: st[0] === 'empty' ? 'idle' : st[0], activity: '보유 종목과 최근 수급을 확인하는 중' })));
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body>
</html>
