[package]
name = "xtask"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
cargo_metadata = { workspace = true }
proc-macro2 = { version = "=1.0.107", default-features = false, features = ["span-locations"] }
ra-ap-rustc_lexer = "=0.184.0"
syn = { version = "=2.0.119", features = ["full", "visit", "visit-mut"] }
toml = "=1.2.1"

typify = { version = "=0.8.0", default-features = false }
schemars = "=0.8.22"
serde_json.workspace = true
quote = "=1.0.47"
sha2 = "=0.10.9"
