[package]
name = "sources"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
application = { path = "../../application" }
domain = { path = "../../domain" }
flate2 = { version = "=1.1.11", default-features = false, features = ["rust_backend"] }
form_urlencoded = "=1.2.3"
quick-xml = { version = "=0.42.0" }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls"] }
serde = { version = "=1.0.229", default-features = false, features = ["derive", "std"] }
serde_json = { version = "=1.0.154", default-features = false, features = ["std"] }
time = { version = "=0.3.55", default-features = false, features = ["parsing", "formatting"] }
tokio = { version = "=1.54.1", default-features = false, features = ["rt", "time", "sync"] }

[dev-dependencies]
testkit = { path = "../../testkit" }
testkit-ports = { path = "../../testkit-ports" }
