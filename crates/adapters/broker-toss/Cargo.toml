[package]
name = "broker-toss"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
application = { path = "../../application" }
domain = { path = "../../domain" }
time = { version = "=0.3.55", default-features = false, features = ["std", "parsing"] }

broker-toss-schema = { path = "../broker-toss-schema" }
serde_json = { workspace = true, features = ["raw_value"] }
serde.workspace = true

reqwest = { version = "=0.13.5", default-features = false, features = ["rustls"] }
tokio = { version = "=1.54.1", default-features = false, features = ["rt", "time", "sync"] }

[dev-dependencies]
testkit-ports = { path = "../../testkit-ports" }
testkit = { path = "../../testkit" }
serde.workspace = true
