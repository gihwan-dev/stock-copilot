{
  "name": "ci",
  "on": {
    "push": {
      "branches": [
        "**"
      ]
    },
    "pull_request": {
      "branches": [
        "master"
      ]
    }
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "linux": {
      "runs-on": "ubuntu-24.04-arm",
      "timeout-minutes": 60,
      "steps": [
        {
          "name": "checkout",
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "fetch-depth": 0,
            "persist-credentials": false
          }
        },
        {
          "name": "node",
          "uses": "actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1",
          "with": {
            "node-version-file": ".node-version"
          }
        },
        {
          "name": "pnpm",
          "run": "corepack enable"
        },
        {
          "name": "tools",
          "uses": "taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39",
          "with": {
            "tool": "just@1.59.0,cargo-nextest@0.9.151,cargo-deny@0.20.2,cargo-llvm-cov@0.9.1"
          }
        },
        {
          "name": "cargo-mutants",
          "run": "node harness/ci/tools.mjs cargo-install"
        },
        {
          "name": "lefthook",
          "run": "node harness/ci/tools.mjs lefthook"
        },
        {
          "name": "fetch",
          "run": "node harness/ci/tools.mjs fetch"
        },
        {
          "name": "advisory db",
          "run": "just advisory-db-fetch"
        },
        {
          "name": "linux check",
          "run": "just linux-check"
        },
        {
          "name": "linux tests without network",
          "run": "node harness/ci/linux/offline.mjs just linux-test"
        }
      ]
    },
    "macos": {
      "if": "github.event_name == 'push' && github.ref == 'refs/heads/master'",
      "runs-on": "macos-15",
      "timeout-minutes": 90,
      "steps": [
        {
          "name": "checkout",
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "fetch-depth": 0,
            "persist-credentials": false
          }
        },
        {
          "name": "node",
          "uses": "actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1",
          "with": {
            "node-version-file": ".node-version"
          }
        },
        {
          "name": "pnpm",
          "run": "corepack enable"
        },
        {
          "name": "tools",
          "uses": "taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39",
          "with": {
            "tool": "just@1.59.0,cargo-nextest@0.9.151,cargo-deny@0.20.2,cargo-llvm-cov@0.9.1"
          }
        },
        {
          "name": "cargo-mutants",
          "run": "node harness/ci/tools.mjs cargo-install"
        },
        {
          "name": "lefthook",
          "run": "node harness/ci/tools.mjs lefthook"
        },
        {
          "name": "fetch",
          "run": "node harness/ci/tools.mjs fetch"
        },
        {
          "name": "advisory db",
          "run": "just advisory-db-fetch"
        },
        {
          "name": "hooks",
          "run": "lefthook install"
        },
        {
          "name": "range",
          "id": "range",
          "run": "node harness/ci/ci-range.mjs base",
          "env": {
            "EVENT_NAME": "${{ github.event_name }}",
            "REF": "${{ github.ref }}",
            "BEFORE": "${{ github.event.before }}",
            "SHA": "${{ github.sha }}",
            "PR_BASE": "${{ github.event.pull_request.base.sha }}",
            "PR_HEAD": "${{ github.event.pull_request.head.sha }}"
          }
        },
        {
          "name": "just check",
          "run": "just base=\"$BASE\" check",
          "env": {
            "BASE": "${{ steps.range.outputs.base }}"
          }
        }
      ]
    },
    "notify": {
      "needs": [
        "linux",
        "macos"
      ],
      "if": "failure() && github.event_name == 'push' && github.ref == 'refs/heads/master'",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 10,
      "permissions": {
        "issues": "write"
      },
      "steps": [
        {
          "name": "base checkout",
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "ref": "${{ github.event.before }}",
            "path": "base-tools",
            "fetch-depth": 1,
            "persist-credentials": false
          }
        },
        {
          "name": "node",
          "uses": "actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1",
          "with": {
            "node-version-file": "base-tools/.node-version"
          }
        },
        {
          "name": "issue",
          "if": "hashFiles('base-tools/harness/ci/notify.mjs') != ''",
          "run": "node base-tools/harness/ci/notify.mjs",
          "env": {
            "GH_TOKEN": "${{ github.token }}",
            "TITLE": "CI 실패: master",
            "RUN_URL": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
            "SHA": "${{ github.sha }}"
          }
        },
        {
          "name": "no notifier",
          "if": "hashFiles('base-tools/harness/ci/notify.mjs') == ''",
          "run": "echo '알림 없음: 기준 checkout에 harness/ci/notify.mjs가 없다'"
        }
      ]
    }
  }
}
