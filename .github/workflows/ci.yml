{
  "name": "ci",
  "on": {
    "push": {
      "branches": [
        "**"
      ]
    },
    "pull_request": {
      "branches": [
        "master"
      ]
    }
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "signatures": {
      "runs-on": "ubuntu-24.04-arm",
      "timeout-minutes": 30,
      "steps": [
        {
          "name": "checkout",
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "fetch-depth": 0,
            "persist-credentials": false
          }
        },
        {
          "name": "node",
          "uses": "actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1",
          "with": {
            "node-version-file": ".node-version"
          }
        },
        {
          "name": "range",
          "id": "range",
          "run": "node harness/ci/ci-range.mjs base",
          "env": {
            "EVENT_NAME": "${{ github.event_name }}",
            "REF": "${{ github.ref }}",
            "BEFORE": "${{ github.event.before }}",
            "SHA": "${{ github.sha }}",
            "PR_BASE": "${{ github.event.pull_request.base.sha }}",
            "PR_HEAD": "${{ github.event.pull_request.head.sha }}"
          }
        },
        {
          "name": "signatures from the base commit",
          "run": "node harness/ci/signatures/from-base.mjs \"$GITHUB_WORKSPACE\" \"$BASE\" \"$HEAD\"",
          "env": {
            "BASE": "${{ steps.range.outputs.base }}",
            "HEAD": "${{ steps.range.outputs.head }}"
          }
        }
      ]
    },
    "linux": {
      "runs-on": "ubuntu-24.04-arm",
      "timeout-minutes": 60,
      "steps": [
        {
          "name": "checkout",
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "fetch-depth": 1,
            "persist-credentials": false
          }
        },
        {
          "name": "node",
          "uses": "actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1",
          "with": {
            "node-version-file": ".node-version"
          }
        },
        {
          "name": "pnpm",
          "run": "corepack enable"
        },
        {
          "name": "tools",
          "uses": "taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39",
          "with": {
            "tool": "just@1.59.0,cargo-nextest@0.9.151,cargo-deny@0.20.2,cargo-llvm-cov@0.9.1"
          }
        },
        {
          "name": "cargo registry cache",
          "uses": "actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9",
          "with": {
            "path": "~/.cargo/registry/index\n~/.cargo/registry/cache\n~/.cargo/git/db",
            "key": "cargo-registry-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}"
          }
        },
        {
          "name": "cargo-mutants cache",
          "uses": "actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9",
          "with": {
            "path": "~/.cargo/bin/cargo-mutants\n~/.cargo/.crates.toml\n~/.cargo/.crates2.json",
            "key": "cargo-mutants-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('harness/ci/tools.json', 'rust-toolchain.toml') }}"
          }
        },
        {
          "name": "cargo-mutants",
          "run": "node harness/ci/tools.mjs cargo-install"
        },
        {
          "name": "lefthook",
          "run": "node harness/ci/tools.mjs lefthook \"$HOME/.local/harness-bin\" && printf '%s\\n' \"$HOME/.local/harness-bin\" >> \"$GITHUB_PATH\""
        },
        {
          "name": "fetch",
          "run": "cargo fetch --locked && node harness/ci/tools.mjs prefetch && pnpm install --frozen-lockfile --ignore-scripts"
        },
        {
          "name": "advisory db",
          "run": "just advisory-db-fetch"
        },
        {
          "name": "linux check",
          "run": "just linux-check"
        },
        {
          "name": "linux tests without network",
          "run": "node harness/ci/linux/offline.mjs just linux-test"
        }
      ]
    },
    "macos": {
      "if": "github.event_name == 'push' && github.ref == 'refs/heads/master'",
      "runs-on": "macos-15",
      "timeout-minutes": 90,
      "steps": [
        {
          "name": "checkout",
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "fetch-depth": 0,
            "persist-credentials": false
          }
        },
        {
          "name": "node",
          "uses": "actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1",
          "with": {
            "node-version-file": ".node-version"
          }
        },
        {
          "name": "pnpm",
          "run": "corepack enable"
        },
        {
          "name": "tools",
          "uses": "taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39",
          "with": {
            "tool": "just@1.59.0,cargo-nextest@0.9.151,cargo-deny@0.20.2,cargo-llvm-cov@0.9.1"
          }
        },
        {
          "name": "cargo registry cache",
          "uses": "actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9",
          "with": {
            "path": "~/.cargo/registry/index\n~/.cargo/registry/cache\n~/.cargo/git/db",
            "key": "cargo-registry-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}"
          }
        },
        {
          "name": "cargo-mutants cache",
          "uses": "actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9",
          "with": {
            "path": "~/.cargo/bin/cargo-mutants\n~/.cargo/.crates.toml\n~/.cargo/.crates2.json",
            "key": "cargo-mutants-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('harness/ci/tools.json', 'rust-toolchain.toml') }}"
          }
        },
        {
          "name": "cargo-mutants",
          "run": "node harness/ci/tools.mjs cargo-install"
        },
        {
          "name": "lefthook",
          "run": "node harness/ci/tools.mjs lefthook \"$HOME/.local/harness-bin\" && printf '%s\\n' \"$HOME/.local/harness-bin\" >> \"$GITHUB_PATH\""
        },
        {
          "name": "fetch",
          "run": "cargo fetch --locked && node harness/ci/tools.mjs prefetch && pnpm install --frozen-lockfile --ignore-scripts"
        },
        {
          "name": "advisory db",
          "run": "just advisory-db-fetch"
        },
        {
          "name": "hooks",
          "run": "lefthook install"
        },
        {
          "name": "range",
          "id": "range",
          "run": "node harness/ci/ci-range.mjs base",
          "env": {
            "EVENT_NAME": "${{ github.event_name }}",
            "REF": "${{ github.ref }}",
            "BEFORE": "${{ github.event.before }}",
            "SHA": "${{ github.sha }}",
            "PR_BASE": "${{ github.event.pull_request.base.sha }}",
            "PR_HEAD": "${{ github.event.pull_request.head.sha }}"
          }
        },
        {
          "name": "just check",
          "run": "just base=\"$BASE\" check",
          "env": {
            "BASE": "${{ steps.range.outputs.base }}"
          }
        }
      ]
    },
    "notify": {
      "needs": [
        "signatures",
        "linux",
        "macos"
      ],
      "if": "failure() && github.event_name == 'push' && github.ref == 'refs/heads/master'",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 10,
      "permissions": {
        "issues": "write"
      },
      "steps": [
        {
          "name": "issue",
          "run": "number=\"$(gh issue list --repo \"$GITHUB_REPOSITORY\" --state open --search \"\\\"$TITLE\\\" in:title\" --json number --jq '.[0].number // empty')\" && if [ -n \"$number\" ]; then gh issue comment \"$number\" --repo \"$GITHUB_REPOSITORY\" --body \"$BODY\"; else gh issue create --repo \"$GITHUB_REPOSITORY\" --title \"$TITLE\" --body \"$BODY\"; fi",
          "env": {
            "GH_TOKEN": "${{ github.token }}",
            "TITLE": "CI 실패: master",
            "BODY": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} ${{ github.workflow }} ${{ github.sha }}"
          }
        }
      ]
    }
  }
}
