{
  "name": "ci",
  "on": {
    "push": {
      "branches": [
        "master",
        "merge/**"
      ]
    },
    "pull_request": {
      "branches": [
        "master"
      ]
    }
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "${{ github.workflow }}-${{ github.ref }}-${{ github.ref == 'refs/heads/master' && format('{0}-{1}', github.run_id, github.run_attempt) || 'branch' }}",
    "cancel-in-progress": "${{ github.ref != 'refs/heads/master' }}"
  },
  "jobs": {
    "linux": {
      "runs-on": "ubuntu-24.04-arm",
      "timeout-minutes": 60,
      "steps": [
        {
          "name": "checkout",
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "fetch-depth": 0,
            "persist-credentials": false
          }
        },
        {
          "name": "node",
          "uses": "actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1",
          "with": {
            "node-version-file": ".node-version"
          }
        },
        {
          "name": "pnpm",
          "run": "node harness/ci/tools.mjs pnpm"
        },
        {
          "name": "tools",
          "uses": "taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39",
          "with": {
            "tool": "just@1.59.0,cargo-nextest@0.9.151,cargo-deny@0.20.2,cargo-llvm-cov@0.9.1"
          }
        },
        {
          "name": "cargo-mutants",
          "run": "node harness/ci/tools.mjs cargo-install"
        },
        {
          "name": "lefthook",
          "run": "node harness/ci/tools.mjs lefthook"
        },
        {
          "name": "fetch",
          "run": "node harness/ci/tools.mjs fetch"
        },
        {
          "name": "advisory db",
          "run": "just advisory-db-fetch"
        },
        {
          "name": "container visual regression",
          "run": "node harness/ci/visual.mjs"
        },
        {
          "name": "linux check",
          "run": "just linux-check"
        },
        {
          "name": "linux tests without network",
          "run": "node harness/ci/linux/offline.mjs just linux-test"
        }
      ]
    },
    "macos": {
      "if": "github.event_name == 'push' && github.ref == 'refs/heads/master'",
      "runs-on": "macos-15",
      "timeout-minutes": 120,
      "steps": [
        {
          "name": "checkout",
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "fetch-depth": 0,
            "persist-credentials": false
          }
        },
        {
          "name": "node",
          "uses": "actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1",
          "with": {
            "node-version-file": ".node-version"
          }
        },
        {
          "name": "pnpm",
          "run": "node harness/ci/tools.mjs pnpm"
        },
        {
          "name": "tools",
          "uses": "taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39",
          "with": {
            "tool": "just@1.59.0,cargo-nextest@0.9.151,cargo-deny@0.20.2,cargo-llvm-cov@0.9.1"
          }
        },
        {
          "name": "cargo-mutants",
          "run": "node harness/ci/tools.mjs cargo-install"
        },
        {
          "name": "lefthook",
          "run": "node harness/ci/tools.mjs lefthook"
        },
        {
          "name": "fetch",
          "run": "node harness/ci/tools.mjs fetch"
        },
        {
          "name": "advisory db",
          "run": "just advisory-db-fetch"
        },
        {
          "name": "hooks",
          "run": "lefthook install"
        },
        {
          "name": "range",
          "id": "range",
          "run": "node harness/ci/ci-range.mjs base",
          "env": {
            "EVENT_NAME": "${{ github.event_name }}",
            "REF": "${{ github.ref }}",
            "BEFORE": "${{ github.event.before }}",
            "SHA": "${{ github.sha }}",
            "PR_BASE": "${{ github.event.pull_request.base.sha }}",
            "PR_HEAD": "${{ github.event.pull_request.head.sha }}"
          }
        },
        {
          "name": "just check",
          "run": "just base=\"$BASE\" check",
          "env": {
            "BASE": "${{ steps.range.outputs.base }}"
          }
        }
      ]
    },
    "macos-branch": {
      "if": "github.event_name == 'push' && github.ref != 'refs/heads/master'",
      "runs-on": "macos-15",
      "timeout-minutes": 120,
      "steps": [
        {
          "name": "checkout",
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "fetch-depth": 0,
            "persist-credentials": false
          }
        },
        {
          "name": "node",
          "uses": "actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1",
          "with": {
            "node-version-file": ".node-version"
          }
        },
        {
          "name": "pnpm",
          "run": "node harness/ci/tools.mjs pnpm"
        },
        {
          "name": "tools",
          "uses": "taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39",
          "with": {
            "tool": "just@1.59.0,cargo-nextest@0.9.151,cargo-deny@0.20.2,cargo-llvm-cov@0.9.1"
          }
        },
        {
          "name": "cargo-mutants",
          "run": "node harness/ci/tools.mjs cargo-install"
        },
        {
          "name": "lefthook",
          "run": "node harness/ci/tools.mjs lefthook"
        },
        {
          "name": "fetch",
          "run": "node harness/ci/tools.mjs fetch"
        },
        {
          "name": "advisory db",
          "run": "just advisory-db-fetch"
        },
        {
          "name": "hooks",
          "run": "lefthook install"
        },
        {
          "name": "range",
          "id": "range",
          "run": "node harness/ci/ci-range.mjs base",
          "env": {
            "EVENT_NAME": "${{ github.event_name }}",
            "REF": "${{ github.ref }}",
            "BEFORE": "${{ github.event.before }}",
            "SHA": "${{ github.sha }}",
            "PR_BASE": "${{ github.event.pull_request.base.sha }}",
            "PR_HEAD": "${{ github.event.pull_request.head.sha }}"
          }
        },
        {
          "name": "branch checkout",
          "run": "node harness/ci/branch-checkout.mjs"
        },
        {
          "name": "just check",
          "run": "just base=\"$BASE\" check",
          "env": {
            "BASE": "${{ steps.range.outputs.base }}"
          }
        }
      ]
    },
    "diff-mutants-plan": {
      "if": "github.event_name == 'push'",
      "runs-on": "ubuntu-24.04-arm",
      "timeout-minutes": 30,
      "outputs": {
        "base": "${{ steps.plan.outputs.base }}",
        "total": "${{ steps.plan.outputs.total }}",
        "linux_count": "${{ steps.plan.outputs.linux_count }}",
        "macos_count": "${{ steps.plan.outputs.macos_count }}",
        "linux_shards": "${{ steps.plan.outputs.linux_shards }}",
        "macos_shards": "${{ steps.plan.outputs.macos_shards }}",
        "run_linux": "${{ steps.plan.outputs.run_linux }}",
        "run_macos": "${{ steps.plan.outputs.run_macos }}"
      },
      "steps": [
        {
          "name": "checkout",
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "fetch-depth": 0,
            "persist-credentials": false
          }
        },
        {
          "name": "node",
          "uses": "actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1",
          "with": {
            "node-version-file": ".node-version"
          }
        },
        {
          "name": "pnpm",
          "run": "node harness/ci/tools.mjs pnpm"
        },
        {
          "name": "tools",
          "uses": "taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39",
          "with": {
            "tool": "just@1.59.0,cargo-nextest@0.9.151,cargo-deny@0.20.2,cargo-llvm-cov@0.9.1"
          }
        },
        {
          "name": "cargo-mutants",
          "run": "node harness/ci/tools.mjs cargo-install"
        },
        {
          "name": "lefthook",
          "run": "node harness/ci/tools.mjs lefthook"
        },
        {
          "name": "fetch",
          "run": "node harness/ci/tools.mjs fetch"
        },
        {
          "name": "range",
          "id": "range",
          "run": "node harness/ci/ci-range.mjs base",
          "env": {
            "EVENT_NAME": "${{ github.event_name }}",
            "REF": "${{ github.ref }}",
            "BEFORE": "${{ github.event.before }}",
            "SHA": "${{ github.sha }}",
            "PR_BASE": "${{ github.event.pull_request.base.sha }}",
            "PR_HEAD": "${{ github.event.pull_request.head.sha }}"
          }
        },
        {
          "name": "diff mutants plan",
          "id": "plan",
          "timeout-minutes": 20,
          "run": "node harness/ci/diff-mutants-plan.mjs",
          "env": {
            "BASE": "${{ steps.range.outputs.base }}"
          }
        }
      ]
    },
    "diff-mutants-linux": {
      "needs": [
        "diff-mutants-plan"
      ],
      "if": "github.event_name == 'push' && needs.diff-mutants-plan.outputs.run_linux == 'yes'",
      "runs-on": "ubuntu-24.04-arm",
      "timeout-minutes": 110,
      "strategy": {
        "fail-fast": false,
        "matrix": {
          "shard": "${{ fromJSON(needs.diff-mutants-plan.outputs.linux_shards) }}"
        },
        "max-parallel": 4
      },
      "steps": [
        {
          "name": "checkout",
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "fetch-depth": 0,
            "persist-credentials": false
          }
        },
        {
          "name": "node",
          "uses": "actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1",
          "with": {
            "node-version-file": ".node-version"
          }
        },
        {
          "name": "pnpm",
          "run": "node harness/ci/tools.mjs pnpm"
        },
        {
          "name": "tools",
          "uses": "taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39",
          "with": {
            "tool": "just@1.59.0,cargo-nextest@0.9.151,cargo-deny@0.20.2,cargo-llvm-cov@0.9.1"
          }
        },
        {
          "name": "cargo-mutants",
          "run": "node harness/ci/tools.mjs cargo-install"
        },
        {
          "name": "lefthook",
          "run": "node harness/ci/tools.mjs lefthook"
        },
        {
          "name": "fetch",
          "run": "node harness/ci/tools.mjs fetch"
        },
        {
          "name": "diff mutants shard",
          "id": "mutation",
          "timeout-minutes": 90,
          "run": "node harness/ci/linux/offline.mjs just mutants-diff-platform-shard \"$MUTATION_BASE\" linux \"$MUTATION_SHARD\"",
          "env": {
            "MUTATION_BASE": "${{ needs.diff-mutants-plan.outputs.base }}",
            "MUTATION_SHARD": "${{ matrix.shard }}"
          }
        },
        {
          "name": "diff mutants summary",
          "if": "always()",
          "run": "node harness/ci/diff-mutants-shard.mjs summary",
          "env": {
            "MUTATION_OUTCOME": "${{ steps.mutation.outcome }}",
            "MUTATION_BASE": "${{ needs.diff-mutants-plan.outputs.base }}",
            "MUTATION_SHARD": "${{ matrix.shard }}",
            "MUTATION_PLATFORM": "linux",
            "MUTATION_EXPECTED_COUNT": "${{ needs.diff-mutants-plan.outputs.linux_count }}",
            "SHA": "${{ github.sha }}"
          }
        }
      ]
    },
    "diff-mutants-macos": {
      "needs": [
        "diff-mutants-plan"
      ],
      "if": "github.event_name == 'push' && needs.diff-mutants-plan.outputs.run_macos == 'yes'",
      "runs-on": "macos-15",
      "timeout-minutes": 180,
      "concurrency": {
        "group": "macos-mutants-slot-${{ (contains(matrix.shard, '0/') || contains(matrix.shard, '2/') || contains(matrix.shard, '4/') || contains(matrix.shard, '6/') || contains(matrix.shard, '8/')) && '0' || '1' }}",
        "queue": "max",
        "cancel-in-progress": false
      },
      "strategy": {
        "fail-fast": false,
        "matrix": {
          "shard": "${{ fromJSON(needs.diff-mutants-plan.outputs.macos_shards) }}"
        },
        "max-parallel": 2
      },
      "steps": [
        {
          "name": "checkout",
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "fetch-depth": 0,
            "persist-credentials": false
          }
        },
        {
          "name": "node",
          "uses": "actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1",
          "with": {
            "node-version-file": ".node-version"
          }
        },
        {
          "name": "pnpm",
          "run": "node harness/ci/tools.mjs pnpm"
        },
        {
          "name": "tools",
          "uses": "taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39",
          "with": {
            "tool": "just@1.59.0,cargo-nextest@0.9.151,cargo-deny@0.20.2,cargo-llvm-cov@0.9.1"
          }
        },
        {
          "name": "cargo-mutants",
          "run": "node harness/ci/tools.mjs cargo-install"
        },
        {
          "name": "lefthook",
          "run": "node harness/ci/tools.mjs lefthook"
        },
        {
          "name": "fetch",
          "run": "node harness/ci/tools.mjs fetch"
        },
        {
          "name": "diff mutants shard",
          "id": "mutation",
          "timeout-minutes": 150,
          "run": "just mutants-diff-platform-shard \"$MUTATION_BASE\" macos \"$MUTATION_SHARD\"",
          "env": {
            "MUTATION_BASE": "${{ needs.diff-mutants-plan.outputs.base }}",
            "MUTATION_SHARD": "${{ matrix.shard }}"
          }
        },
        {
          "name": "diff mutants summary",
          "if": "always()",
          "run": "node harness/ci/diff-mutants-shard.mjs summary",
          "env": {
            "MUTATION_OUTCOME": "${{ steps.mutation.outcome }}",
            "MUTATION_BASE": "${{ needs.diff-mutants-plan.outputs.base }}",
            "MUTATION_SHARD": "${{ matrix.shard }}",
            "MUTATION_PLATFORM": "macos",
            "MUTATION_EXPECTED_COUNT": "${{ needs.diff-mutants-plan.outputs.macos_count }}",
            "SHA": "${{ github.sha }}"
          }
        }
      ]
    },
    "diff-mutants-verdict": {
      "needs": [
        "diff-mutants-plan",
        "diff-mutants-linux",
        "diff-mutants-macos"
      ],
      "if": "always() && github.event_name == 'push'",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 10,
      "permissions": {
        "contents": "read",
        "actions": "read"
      },
      "steps": [
        {
          "name": "checkout",
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "fetch-depth": 1,
            "persist-credentials": false
          }
        },
        {
          "name": "node",
          "uses": "actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1",
          "with": {
            "node-version-file": ".node-version"
          }
        },
        {
          "name": "diff mutants aggregate",
          "run": "node harness/ci/diff-mutants-aggregate.mjs",
          "env": {
            "GH_TOKEN": "${{ github.token }}",
            "SHA": "${{ github.sha }}",
            "RUN_ID": "${{ github.run_id }}",
            "RUN_ATTEMPT": "${{ github.run_attempt }}",
            "REPOSITORY": "${{ github.repository }}",
            "PLAN_RESULT": "${{ needs.diff-mutants-plan.result }}",
            "LINUX_RESULT": "${{ needs.diff-mutants-linux.result }}",
            "MACOS_RESULT": "${{ needs.diff-mutants-macos.result }}",
            "MUTATION_TOTAL": "${{ needs.diff-mutants-plan.outputs.total }}",
            "LINUX_COUNT": "${{ needs.diff-mutants-plan.outputs.linux_count }}",
            "MACOS_COUNT": "${{ needs.diff-mutants-plan.outputs.macos_count }}",
            "LINUX_SHARDS": "${{ needs.diff-mutants-plan.outputs.linux_shards }}",
            "MACOS_SHARDS": "${{ needs.diff-mutants-plan.outputs.macos_shards }}",
            "RUN_LINUX": "${{ needs.diff-mutants-plan.outputs.run_linux }}",
            "RUN_MACOS": "${{ needs.diff-mutants-plan.outputs.run_macos }}"
          }
        }
      ]
    },
    "notify": {
      "needs": [
        "linux",
        "macos",
        "diff-mutants-verdict"
      ],
      "if": "failure() && github.event_name == 'push' && github.ref == 'refs/heads/master'",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 10,
      "permissions": {
        "issues": "write"
      },
      "steps": [
        {
          "name": "base checkout",
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "ref": "${{ github.event.before }}",
            "path": "base-tools",
            "fetch-depth": 1,
            "persist-credentials": false
          }
        },
        {
          "name": "node",
          "uses": "actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1",
          "with": {
            "node-version-file": "base-tools/.node-version"
          }
        },
        {
          "name": "issue",
          "if": "hashFiles('base-tools/harness/ci/notify.mjs') != ''",
          "run": "node base-tools/harness/ci/notify.mjs",
          "env": {
            "GH_TOKEN": "${{ github.token }}",
            "TITLE": "CI 실패: master",
            "RUN_URL": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
            "SHA": "${{ github.sha }}"
          }
        },
        {
          "name": "no notifier",
          "if": "hashFiles('base-tools/harness/ci/notify.mjs') == ''",
          "run": "echo '알림 없음: 기준 checkout에 harness/ci/notify.mjs가 없다'"
        }
      ]
    }
  }
}
